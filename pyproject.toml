[project]
name = "albumgrab"
version = "0.1.0"
description = "Grab YouTube Music albums as tagged MP3 files"
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.12",
    "yt-dlp>=2026.7",
    "mutagen",
    "typer",
]

[project.scripts]
albumgrab = "albumgrab.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/albumgrab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests that hit the real YouTube Music network (deselected by default)",
]
